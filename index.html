<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Online Naplo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/frontend/css/styles.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow-sm">
        <div class="container">
            <span class="navbar-brand mb-0 h1">Online Naplo</span>
            <div class="d-flex align-items-center gap-2">
                <span id="currentUser" class="badge text-bg-success d-none"></span>
                <button id="logoutButton" class="btn btn-outline-light btn-sm d-none" type="button">Kijelentkezes</button>
            </div>
        </div>
    </nav>

    

        <section id="statusBanner" class="alert d-none" role="alert"></section>

        <section id="authLayout" class="row g-4">
            <div class="col-12 col-lg-6"> 
                <form id="loginForm" class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">
                        <h3 class="h4 mb-3">Bejelentkezes</h3>
                        <div class="mb-3">
                            <label class="form-label" for="loginUsername">Felhasznalonev</label>
                            <input class="form-control" id="loginUsername" name="username" type="text" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="loginPassword">Jelszo</label>
                            <input class="form-control" id="loginPassword" name="password" type="password" required>
                        </div>
                        <button class="btn btn-primary" type="submit">Belepes</button>
                    </div>
                </form>
            </div>

            <div class="col-12 col-lg-6">
                <form id="registerForm" class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">
                        <h3 class="h4 mb-3">Regisztracio</h3>
                        <div class="mb-3">
                            <label class="form-label" for="registerUsername">Felhasznalonev</label>
                            <input class="form-control" id="registerUsername" name="username" type="text" minlength="3" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="registerEmail">Email</label>
                            <input class="form-control" id="registerEmail" name="email" type="email" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="registerPassword">Jelszo</label>
                            <input class="form-control" id="registerPassword" name="password" type="password" minlength="6" required>
                        </div>
                        <button class="btn btn-success" type="submit">Fiok letrehozasa</button>
                    </div>
                </form>
            </div>
        </section>

        <section id="workspace" class="row g-4 d-none">
            <div class="col-12 col-xl-5">
                <section class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                            <h3 id="editorTitle" class="h4 mb-0">Uj jegyzet</h3>
                            <button id="resetEditorButton" class="btn btn-outline-secondary btn-sm" type="button">Uj jegyzet</button>
                        </div>

                        <form id="noteForm">
                            <input id="noteId" type="hidden">

                            <div class="mb-3">
                                <label class="form-label" for="noteTitle">Cim</label>
                                <input class="form-control" id="noteTitle" name="title" type="text" maxlength="200" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="noteCategory">Kategoria</label>
                                <input class="form-control" id="noteCategory" name="category" type="text" placeholder="Peldaul: munka, otlet, szemelyes">
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="noteContent">Tartalom</label>
                                <textarea class="form-control" id="noteContent" name="content" rows="11" required></textarea>
                            </div>

                            <div class="d-flex gap-2 flex-wrap">
                                <button id="saveNoteButton" class="btn btn-primary" type="submit">Mentes</button>
                                <button id="deleteNoteButton" class="btn btn-outline-danger d-none" type="button">Torles</button>
                            </div>
                        </form>
                    </div>
                </section>
            </div>

            <div class="col-12 col-xl-7">
                <section class="card shadow-sm border-0 h-100">
                    <div class="card-body p-4">
                        <div class="d-flex flex-wrap justify-content-between align-items-center mb-3 gap-2">
                            <h3 class="h4 mb-0">Jegyzetlista</h3>
                            <button id="refreshNotesButton" class="btn btn-outline-primary btn-sm" type="button">Frissites</button>
                        </div>

                        <div class="mb-3">
                            <label class="form-label" for="searchInput">Kereses</label>
                            <input id="searchInput" class="form-control" type="search" placeholder="Keress cimre vagy szovegre">
                        </div>

                        <div id="notesList" class="notes-list"></div>
                    </div>
                </section>
            </div>
        </section>
    </main>

    <script src="/frontend/js/app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
